name: Sync to iNA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync to porasnagar/iNA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to porasnagar/iNA
        env:
          SYNC_TOKEN: ${{ secrets.INA_SYNC_TOKEN || secrets.SYNC_TOKEN || secrets.GH_PAT || secrets.PAT }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Missing INA_SYNC_TOKEN secret! Please add INA_SYNC_TOKEN (Personal Access Token with 'repo' scope) to Settings -> Secrets and variables -> Actions in porasnagar/apple-device-orbit."
            exit 1
          fi

          # Unset any extraheader injected by actions/checkout
          git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true

          # Enforce pure porasnagar authorship so bot commits never enter public iNA repo
          export GIT_AUTHOR_NAME="porasnagar"
          export GIT_AUTHOR_EMAIL="86702426+porasnagar@users.noreply.github.com"
          export GIT_COMMITTER_NAME="porasnagar"
          export GIT_COMMITTER_EMAIL="86702426+porasnagar@users.noreply.github.com"

          git config user.name "porasnagar"
          git config user.email "86702426+porasnagar@users.noreply.github.com"

          # Add authenticated remote for iNA
          git remote add destination "https://x-access-token:${SYNC_TOKEN}@github.com/porasnagar/iNA.git"

          msg="$(git log -1 --format=%s)"

          echo "==> Syncing website & main branches as porasnagar..."
          tree=$(git rev-parse HEAD^{tree})
          parent_args=()
          if git fetch --depth=1 destination website 2>/dev/null; then
            parent_sha=$(git rev-parse FETCH_HEAD)
            parent_args=(-p "$parent_sha")
          fi
          clean_sha=$(git commit-tree "$tree" "${parent_args[@]}" -m "$msg")

          echo "==> Pushing to iNA website branch..."
          git push destination "$clean_sha:refs/heads/website" --force

          echo "==> Pushing to iNA main branch..."
          git push destination "$clean_sha:refs/heads/main" --force

          echo "==> Syncing standalone Android Studio project to android branch..."
          android_tree=$(git rev-parse HEAD:src/android)
          android_parent_args=()
          if git fetch --depth=1 destination android 2>/dev/null; then
            android_parent=$(git rev-parse FETCH_HEAD)
            android_parent_args=(-p "$android_parent")
          fi
          android_sha=$(git commit-tree "$android_tree" "${android_parent_args[@]}" -m "$msg")
          git push destination "$android_sha:refs/heads/android" --force

          echo "==> Successfully synchronized to porasnagar/iNA with 100% porasnagar authorship!"
