name: Merge Bot

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled, auto_merge_enabled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  slash-command-merge:
    name: Slash Command Merge (/merge, /squash)
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/merge') ||
       startsWith(github.event.comment.body, '/squash') ||
       startsWith(github.event.comment.body, '/automerge'))
    runs-on: ubuntu-latest
    steps:
      - name: Verify permissions & merge PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.trim().toLowerCase();
            const prNumber = context.payload.issue.number;
            const sender = context.payload.comment.user.login;

            // Check if sender has write or admin permissions
            const permResponse = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: sender,
            });
            const permission = permResponse.data.permission;
            if (!['admin', 'write'].includes(permission)) {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '-1',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ @${sender}, you do not have write permissions to merge pull requests in this repository.`,
              });
              return;
            }

            // React with rocket
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

            // Get PR details
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.data.merged) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `ℹ️ Pull Request #${prNumber} is already merged.`,
              });
              return;
            }

            if (!pr.data.mergeable) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ Pull Request #${prNumber} cannot be merged automatically because it has merge conflicts or is currently blocked by checks.`,
              });
              return;
            }

            const mergeMethod = comment.startsWith('/squash') ? 'squash' : 'merge';

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: mergeMethod,
                commit_title: `${pr.data.title} (#${prNumber})`,
                commit_message: `Merged by @${sender} via Merge Bot.`,
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `🚀 Pull Request #${prNumber} has been successfully merged by **@${sender}** using \`${mergeMethod}\`!`,
              });
            } catch (err) {
              core.setFailed(`Failed to merge PR: ${err.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ Failed to merge PR #${prNumber}: ${err.message}`,
              });
            }

  label-auto-merge:
    name: Auto-Merge on Label / Approval
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.merged) return;

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `${pr.title} (#${pr.number})`,
                commit_message: `Auto-merged via Merge Bot.`,
              });
              core.info(`Successfully auto-merged PR #${pr.number}`);
            } catch (err) {
              core.warning(`Auto-merge condition not yet satisfied: ${err.message}`);
            }
