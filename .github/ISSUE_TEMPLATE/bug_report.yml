name: Bug Report
description: File a bug report to help improve iNA
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.
  - type: input
    id: device
    attributes:
      label: Android Device & Model
      description: What phone or tablet are you using? (e.g. Google Pixel 8, Samsung Galaxy S24, OnePlus 12)
      placeholder: "e.g. Samsung Galaxy S24 Ultra (OneUI 6.1)"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android Version
      description: What version of Android is installed?
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true
  - type: input
    id: accessory
    attributes:
      label: Connected Accessory
      description: Which accessory are you testing?
      placeholder: "e.g. AirPods Pro 2 (USB-C, Firmware 7B19)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open iNA
        2. Open AirPods case near device
        3. Tap 'Noise Cancellation'
        4. See error or lack of response
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logcat Output
      description: Please paste logs filtered with `adb logcat -s iBridgeUniversal`
      render: shell
