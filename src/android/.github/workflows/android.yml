name: Build iNA APK

# Lives at the root of the `android` branch (copied there from src/android on the website
# branch). Push a tag like v1.2.0 on the android branch to build and release that commit.
# Regular syncs are built by the website branch's "Android branch + APK" workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # List exact SDK packages; the retired "tools" package no longer exists.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      # Pinned Gradle 8.11.1 (matches AGP 8.10.1). Never "current" — Gradle 9+ breaks AGP 8.x.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.INA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ina-release.jks"
            echo "INA_KEYSTORE_FILE=$RUNNER_TEMP/ina-release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No INA_KEYSTORE_BASE64 secret, so the release APK is signed with the debug key."
          fi

      - name: Build test (debug) and release APKs
        env:
          INA_KEYSTORE_PASSWORD: ${{ secrets.INA_KEYSTORE_PASSWORD }}
          INA_KEY_ALIAS: ${{ secrets.INA_KEY_ALIAS }}
          INA_KEY_PASSWORD: ${{ secrets.INA_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: iNA-apks
          retention-days: 3
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Attach APKs to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
